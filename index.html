
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoma Store - متجر يوما</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

   
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <h1>Yoma <span>Store</span></h1>
            </div>

            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
                <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>

            <nav class="nav-links">
                <select id="categoryFilter" class="filter-dropdown">
                    <option value="all">كل التصنيفات</option>
                    
                </select>
                <div class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount">0</span>
                </div>
            </nav>
        </div>
    </header>

    
    <section class="hero-banner">
        <div class="container">
            <h2>مرحباً بكم في Yoma Store</h2>
            <p>اكتشف أفضل المنتجات بأفضل الأسعار</p>
        </div>
    </section>

   
    <main class="container">
        
        
        <div id="loadingState" class="status-message hidden">
            <div class="spinner"></div>
            <p>جاري تحميل المنتجات...</p>
        </div>

        <div id="errorState" class="status-message error hidden">
            <p>حدث خطأ أثناء جلب البيانات! يرجى المحاولة مرة أخرى.</p>
            <button id="retryBtn">إعادة المحاولة</button>
        </div>

        <section class="products-section">
            <h3>أحدث المنتجات</h3>
            <div id="productsGrid" class="products-grid">
                
            </div>
        </section>

    </main>

   
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 Yoma Store. جميع الحقوق محفوظة.</p>
        </div>
    </footer> 
    
    <script src="script.js"></script>
</body>
</html>
